<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contests | CPInsight</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon_32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/shared.css?v=3" />
  <link rel="stylesheet" href="../src/components/ai/ai-components.css?v=1" />
  <script src="../script/auth.js?v=2"></script>
  <script src="../script/shared.js?v=2"></script>
  <style>
    .contest-shell {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    .contest-list-panel,
    .contest-detail-panel {
      min-height: 520px;
    }

    .contest-list-row[aria-selected="true"] {
      border-color: rgba(16, 185, 129, 0.65);
      background: rgba(16, 185, 129, 0.1);
    }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .review-section {
      display: grid;
      gap: 1rem;
    }

    .review-section-wide {
      grid-column: 1 / -1;
    }

    .review-export-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .ai-theme-root {
      background: transparent;
    }

    @media (max-width: 1100px) {
      .contest-shell,
      .review-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <script src="../script/services/httpClient.js?v=5"></script>
  <script src="../script/services/authService.js?v=5"></script>
  <script src="../script/services/userService.js?v=5"></script>
  <script src="../script/services/platformService.js?v=5"></script>
  <script src="../script/services/analyticsService.js?v=6"></script>
  <script src="../script/services/stateManager.js?v=5"></script>
  <script src="../script/components/notification.js?v=5"></script>
  <script src="../script/components/userMenu.js?v=5"></script>
  <script src="../script/utils/routeProtection.js?v=5"></script>
  <script>RouteProtection.protectPage();</script>

  <canvas id="particleCanvas" class="fixed inset-0 w-full h-full z-[-1] pointer-events-none"></canvas>

  <div id="mainApp" class="flex min-h-screen overflow-x-hidden transition-[filter] duration-700 ease-in-out">
    <div id="mobileBackdrop" aria-hidden="true"></div>
    <aside id="appSidebar" class="w-[320px] min-w-[320px] glass border-r border-white/10 p-6 overflow-hidden !rounded-none flex flex-col">
      <a href="landing_page.html" class="flex items-center gap-1 mb-10 group" aria-label="Return to CPInsight home">
        <img src="../Assets/logo.png" alt="CPInsight Logo" class="w-10 h-10 object-contain mt-0.5" onerror="this.style.display='none'">
        <h1 class="text-3xl font-black tracking-tight leading-none group-hover:text-emerald-300 transition">CPInsight</h1>
      </a>

      <div class="space-y-3">
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='dashboard.html'">Dashboard</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='analytics.html'">Analytics</button>
        <button class="w-full min-w-0 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-2xl p-4 text-left font-semibold truncate shadow-[0_0_10px_rgba(16,185,129,0.1)] transition" onclick="window.location.href='contests.html'">Contests</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='compare.html'">Compare</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='calendar.html'">Calendar</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='ai-coach.html'">AI Coach</button>
      </div>

      <button onclick="window.location.href='platforms.html'" class="w-full min-w-0 hover:bg-white/5 border border-transparent border-t-white/10 rounded-none p-4 text-left transition truncate text-gray-400 hover:text-white mt-4 flex items-center gap-3">
        <span>Settings</span> Manage Platforms
      </button>
    </aside>

    <main class="flex-1 min-w-0 p-6 md:p-10 z-10 relative">
      <button id="mobileMenuBtn" aria-label="Open navigation menu" aria-expanded="false" class="lg:hidden text-gray-400 hover:text-white mb-6 focus:outline-none transition-colors">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <div class="mb-8 reveal visible relative z-50">
        <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-6">
          <div>
            <p class="text-emerald-400 text-sm font-bold uppercase tracking-[0.3em]">Contest History</p>
            <h1 class="text-4xl font-black tracking-tight mt-2">Contests</h1>
            <p id="contestPageStatus" class="text-gray-400 mt-2">Loading completed contest history...</p>
          </div>
          <div id="userMenuContainer" class="relative z-[80] flex lg:justify-end"></div>
        </div>
      </div>

      <section class="contest-shell">
        <aside class="contest-list-panel glass rounded-3xl p-6">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
            <div>
              <h2 class="text-2xl font-bold tracking-tight">Contest List</h2>
              <p class="text-gray-400 text-sm mt-1">Select a completed contest to inspect details and its AI review.</p>
            </div>
            <select id="contestPlatformFilter" class="bg-black/30 border border-white/10 rounded-xl px-4 py-2 outline-none hover:border-emerald-500/50 transition cursor-pointer" aria-label="Filter contests by platform">
              <option value="all">All platforms</option>
            </select>
          </div>
          <div id="contestList" class="space-y-3 max-h-[720px] overflow-y-auto scrollbar pr-2"></div>
        </aside>

        <section class="contest-detail-panel glass rounded-3xl p-6 ai-theme-root" aria-live="polite">
          <div id="contestDetail"></div>
          <div id="contestReviewPanel" class="mt-8"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="../script/contests.js?v=1"></script>
  <div id="notificationContainer"></div>
</body>

</html>
