<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contests | CPInsight</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon_32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/shared.css?v=8" />
  <link rel="stylesheet" href="../src/components/ai/ai-components.css?v=1" />
  <script src="../script/auth.js?v=2"></script>
  <script src="../script/shared.js?v=8"></script>
  <style>
    .contest-shell {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    .contest-list-panel,
    .contest-detail-panel {
      min-height: 520px;
    }

    .contest-list-row[aria-selected="true"] {
      border-color: rgba(16, 185, 129, 0.65);
      background: rgba(16, 185, 129, 0.1);
    }

    .contest-list-main {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      padding: 0;
    }

    .contest-metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(7.5rem, auto);
      gap: 0.75rem;
    }

    .contest-metrics-grid > * {
      min-width: 0;
    }

    .review-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      max-width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: #d1d5db;
      font-size: 0.75rem;
      font-weight: 800;
      line-height: 1.2;
      margin-top: 0.25rem;
      padding: 0.35rem 0.6rem;
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: left;
    }

    button.review-status-badge {
      cursor: pointer;
    }

    .review-status-ready {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.1);
      color: #6ee7b7;
    }

    .review-status-processing {
      border-color: rgba(234, 179, 8, 0.45);
      background: rgba(234, 179, 8, 0.1);
      color: #fde68a;
    }

    .review-status-failed {
      border-color: rgba(244, 63, 94, 0.45);
      background: rgba(244, 63, 94, 0.1);
      color: #fda4af;
    }

    .review-status-neutral {
      color: #9ca3af;
    }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .review-section {
      display: grid;
      gap: 1rem;
    }

    .review-section-wide {
      grid-column: 1 / -1;
    }

    .review-export-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .review-tabs,
    .replay-controls,
    .replay-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .review-tab {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: #d1d5db;
      font-weight: 800;
      padding: 0.55rem 0.9rem;
    }

    .review-tab[aria-selected="true"] {
      border-color: rgba(16, 185, 129, 0.55);
      background: rgba(16, 185, 129, 0.14);
      color: #6ee7b7;
    }

    .replay-layout {
      display: grid;
      gap: 1rem;
    }

    .replay-header {
      display: grid;
      gap: 1rem;
      padding: 1rem;
    }

    .replay-header h2 {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .replay-header-metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .replay-header-metrics dt {
      color: #9ca3af;
      font-size: 0.75rem;
    }

    .replay-header-metrics dd {
      color: #fff;
      font-weight: 800;
      margin: 0.1rem 0 0;
    }

    .replay-scrubber-card,
    .replay-controls {
      padding: 1rem;
    }

    .replay-scrubber-labels {
      display: flex;
      justify-content: space-between;
      color: #9ca3af;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .replay-scrubber {
      inline-size: 100%;
      accent-color: #10b981;
    }

    .replay-markers {
      position: relative;
      block-size: 1rem;
      margin-top: 0.35rem;
    }

    .replay-markers button {
      position: absolute;
      inline-size: 0.65rem;
      block-size: 0.65rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: #10b981;
      cursor: pointer;
      transform: translateX(-50%);
    }

    .replay-progress-track {
      overflow: hidden;
      block-size: 0.4rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      margin-top: 0.5rem;
    }

    .replay-progress-track span {
      display: block;
      block-size: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #10b981, #60a5fa);
      transition: inline-size 180ms cubic-bezier(0.2, 0, 0, 1);
    }

    .replay-controls {
      align-items: center;
    }

    .replay-controls label,
    .replay-filter {
      align-items: center;
      color: #d1d5db;
      display: inline-flex;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 700;
    }

    .replay-speed-select {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.5rem;
      color: #fff;
      padding: 0.35rem 0.5rem;
    }

    .replay-main {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }

    .replay-sidebar {
      padding: 1rem;
      position: sticky;
      top: 1rem;
    }

    .replay-sidebar h3,
    .replay-event-detail h3 {
      color: #fff;
      font-weight: 800;
    }

    .replay-event-list {
      display: grid;
      gap: 0.5rem;
      list-style: none;
      margin: 1rem 0 0;
      max-height: 420px;
      overflow: auto;
      padding: 0;
    }

    .replay-event-button {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      color: #d1d5db;
      display: grid;
      gap: 0.15rem;
      inline-size: 100%;
      padding: 0.65rem;
      text-align: left;
    }

    .replay-event-button span {
      color: #10b981;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .replay-event-button[aria-current="true"] {
      border-color: rgba(16, 185, 129, 0.55);
      background: rgba(16, 185, 129, 0.12);
      color: #fff;
    }

    .replay-panels {
      display: grid;
      gap: 1rem;
      min-width: 0;
    }

    .replay-comparison > div {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 1rem;
    }

    .replay-comparison h4 {
      color: #fff;
      font-weight: 800;
    }

    .ai-theme-root {
      background: transparent;
    }

    @media (max-width: 1100px) {
      .contest-shell,
      .review-grid,
      .replay-main,
      .replay-comparison > div {
        grid-template-columns: 1fr;
      }

      .replay-header-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .replay-sidebar {
        position: static;
      }
    }

    @media (max-width: 520px) {
      .contest-metrics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <script src="../script/services/httpClient.js?v=5"></script>
  <script src="../script/services/authService.js?v=5"></script>
  <script src="../script/services/userService.js?v=5"></script>
  <script src="../script/services/platformService.js?v=5"></script>
  <script src="../script/services/analyticsService.js?v=6"></script>
  <script src="../script/services/stateManager.js?v=5"></script>
  <script src="../script/components/notification.js?v=5"></script>
  <script src="../script/components/userMenu.js?v=5"></script>
  <script src="../script/utils/routeProtection.js?v=5"></script>
  <script>RouteProtection.protectPage();</script>

  <canvas id="particleCanvas" class="fixed inset-0 w-full h-full z-[-1] pointer-events-none"></canvas>

  <div id="mainApp" class="flex min-h-screen overflow-x-hidden transition-[filter] duration-700 ease-in-out">
    <div id="mobileBackdrop" aria-hidden="true"></div>
    <aside id="appSidebar" class="w-[320px] min-w-[320px] glass border-r border-white/10 p-6 overflow-hidden !rounded-none flex flex-col">
      <a href="landing_page.html" class="flex items-center gap-1 mb-10 group" aria-label="Return to CPInsight home">
        <img src="../Assets/logo.png" alt="CPInsight Logo" class="w-10 h-10 object-contain mt-0.5" onerror="this.style.display='none'">
        <h1 class="text-3xl font-black tracking-tight leading-none group-hover:text-emerald-300 transition">CPInsight</h1>
      </a>

      <div id="sidebarProfileCard" class="glass sidebar-profile-card" aria-label="User profile"></div>

      <div class="space-y-3">
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='dashboard.html'">&#128202; Dashboard</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='analytics.html'">&#129504; Analytics</button>
        <button class="w-full min-w-0 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-2xl p-4 text-left font-semibold truncate shadow-[0_0_10px_rgba(16,185,129,0.1)] transition" onclick="window.location.href='contests.html'">&#127942; Contests</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='compare.html'">&#128101; Compare</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='ai-coach.html'">&#128161; AI Assistant</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='articles.html'">&#128240; Articles</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='calendar.html'">&#128197; Calendar</button>
      </div>

      <button onclick="window.location.href='platforms.html'" class="w-full min-w-0 hover:bg-white/5 border border-transparent border-t-white/10 rounded-none p-4 text-left transition truncate text-gray-400 hover:text-white mt-4 flex items-center gap-3">
        <span>&#9881;</span> Manage Platforms
      </button>
    </aside>

    <main class="flex-1 min-w-0 p-6 md:p-10 z-10 relative">
      <button id="mobileMenuBtn" aria-label="Open navigation menu" aria-expanded="false" class="lg:hidden text-gray-400 hover:text-white mb-6 focus:outline-none transition-colors">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <div class="mb-8 reveal visible relative z-50">
        <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-6">
          <div>
            <p class="text-emerald-400 text-sm font-bold uppercase tracking-[0.3em]">Contest History</p>
            <h1 class="text-4xl font-black tracking-tight mt-2">Contests</h1>
            <p id="contestPageStatus" class="text-gray-400 mt-2">Loading completed contest history...</p>
          </div>
          <div id="userMenuContainer" class="relative z-[80] flex lg:justify-end"></div>
        </div>
      </div>

      <section class="contest-shell">
        <aside class="contest-list-panel glass rounded-3xl p-6">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
            <div>
              <h2 class="text-2xl font-bold tracking-tight">Contest List</h2>
              <p class="text-gray-400 text-sm mt-1">Select a completed contest to inspect details and its AI review.</p>
            </div>
            <select id="contestPlatformFilter" class="bg-black/30 border border-white/10 rounded-xl px-4 py-2 outline-none hover:border-emerald-500/50 transition cursor-pointer" aria-label="Filter contests by platform">
              <option value="all">All platforms</option>
            </select>
          </div>
          <div id="contestList" class="space-y-3 max-h-[720px] overflow-y-auto scrollbar pr-2"></div>
        </aside>

        <section class="contest-detail-panel glass rounded-3xl p-6 ai-theme-root" aria-live="polite">
          <div id="contestDetail"></div>
          <div id="contestReviewPanel" class="mt-8"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="../script/contests.js?v=2"></script>
  <div id="notificationContainer"></div>
</body>

</html>
