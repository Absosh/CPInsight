<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPInsight | Platforms</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon_32.png">
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../css/shared.css?v=5" />
  <script src="../script/shared.js?v=5"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <script src="../script/services/httpClient.js"></script>
  <script src="../script/services/authService.js"></script>
  <script src="../script/services/userService.js"></script>
  <script src="../script/services/platformService.js"></script>
  <script src="../script/services/analyticsService.js"></script>
  <script src="../script/services/stateManager.js"></script>
  <script src="../script/components/notification.js"></script>
  <script src="../script/components/userMenu.js"></script>
  <script src="../script/components/connectModal.js"></script>
  <script src="../script/utils/routeProtection.js"></script>
  <script>RouteProtection.protectPage();</script>

  <canvas id="particleCanvas" class="fixed inset-0 w-full h-full z-[-1] pointer-events-none"></canvas>

  <div id="mainApp" class="flex min-h-screen overflow-x-hidden transition-[filter] duration-700 ease-in-out">
    <div id="mobileBackdrop" aria-hidden="true"></div>

    <aside id="appSidebar" class="w-[320px] min-w-[320px] glass border-r border-white/10 p-6 overflow-hidden !rounded-none flex flex-col">
      <a href="landing_page.html" class="flex items-center gap-1 mb-10 group" aria-label="Return to CPInsight home">
        <img src="../Assets/logo.png" alt="CPInsight Logo" class="w-10 h-10 object-contain mt-0.5" onerror="this.style.display='none'">
        <h1 class="text-3xl font-black tracking-tight leading-none group-hover:text-emerald-300 transition">CPInsight</h1>
      </a>

      <div id="sidebarProfileCard" class="glass sidebar-profile-card" aria-label="User profile"></div>

      <nav id="accountSettingsNav" class="space-y-3 flex-1"></nav>

      <button class="w-full bg-red-600/20 text-red-400 border border-red-500/30 rounded-2xl p-4 font-semibold hover:bg-red-600/30 transition" id="logoutBtn">
        Logout
      </button>
    </aside>

    <main class="flex-1 min-w-0 p-6 md:p-10 z-10 relative overflow-auto">
      <button id="mobileMenuBtn" aria-label="Open account settings menu" aria-expanded="false" class="lg:hidden text-gray-400 hover:text-white mb-6 focus:outline-none transition-colors">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <div class="w-full">
        <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-6 mb-10 reveal visible relative z-50">
          <div>
            <h1 class="text-4xl font-black tracking-tight">Platforms</h1>
            <p class="text-gray-400 mt-2">Manage your competitive programming platform accounts.</p>
          </div>
          <div id="userMenuContainer" class="relative z-[80] flex lg:justify-end"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 reveal visible">
          <div class="glass rounded-3xl p-6 border border-white/10 hover:-translate-y-1 transition">
            <div class="mb-3 w-14 h-14 rounded-2xl bg-white/90 border border-white/10 flex items-center justify-center p-2 shadow-[0_0_18px_rgba(16,185,129,0.12)]">
              <img src="../Assets/platforms/codeforces.png" alt="Codeforces" class="w-full h-full object-contain" />
            </div>
            <h3 class="text-xl font-bold mb-2">Codeforces</h3>
            <p class="text-gray-400 text-sm mb-4">Competitive Programming Platform</p>
            <button onclick="window.connectModal.openForPlatform('codeforces')" class="w-full bg-emerald-600 py-3 rounded-2xl text-sm font-semibold hover:bg-emerald-500 transition shadow-[0_0_15px_rgba(16,185,129,0.25)] text-gray-900">
              Connect Account
            </button>
          </div>

          <div class="glass rounded-3xl p-6 border border-white/10 hover:-translate-y-1 transition">
            <div class="mb-3 w-14 h-14 rounded-2xl bg-white/90 border border-white/10 flex items-center justify-center p-2 shadow-[0_0_18px_rgba(16,185,129,0.12)]">
              <img src="../Assets/platforms/codechef.jpg" alt="CodeChef" class="w-full h-full object-contain rounded-xl" />
            </div>
            <h3 class="text-xl font-bold mb-2">CodeChef</h3>
            <p class="text-gray-400 text-sm mb-4">Cooking with Code</p>
            <button onclick="window.connectModal.openForPlatform('codechef')" class="w-full bg-emerald-600 py-3 rounded-2xl text-sm font-semibold hover:bg-emerald-500 transition shadow-[0_0_15px_rgba(16,185,129,0.25)] text-gray-900">
              Connect Account
            </button>
          </div>

          <div class="glass rounded-3xl p-6 border border-white/10 hover:-translate-y-1 transition">
            <div class="mb-3 w-14 h-14 rounded-2xl bg-white/90 border border-white/10 flex items-center justify-center p-2 shadow-[0_0_18px_rgba(16,185,129,0.12)]">
              <img src="../Assets/platforms/leetcode.png" alt="LeetCode" class="w-full h-full object-contain" />
            </div>
            <h3 class="text-xl font-bold mb-2">LeetCode</h3>
            <p class="text-gray-400 text-sm mb-4">Interview Preparation</p>
            <button onclick="window.connectModal.openForPlatform('leetcode')" class="w-full bg-emerald-600 py-3 rounded-2xl text-sm font-semibold hover:bg-emerald-500 transition shadow-[0_0_15px_rgba(16,185,129,0.25)] text-gray-900">
              Connect Account
            </button>
          </div>

        </div>

        <div class="glass rounded-3xl p-8 border border-white/10 reveal">
          <h2 class="text-2xl font-bold mb-6">Your Connected Accounts</h2>
          <div id="accountsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="skeleton h-32 rounded-3xl"></div>
            <div class="skeleton h-32 rounded-3xl"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="notificationContainer"></div>
  <div id="connectModalContainer"></div>
  <script src="../script/platforms.js"></script>
</body>
</html>
