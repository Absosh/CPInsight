<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPInsight | Profile</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../Assets/favicon_32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Services & State -->
  <script src="../script/services/httpClient.js"></script>
  <script src="../script/services/authService.js"></script>
  <script src="../script/services/userService.js"></script>
  <script src="../script/services/platformService.js"></script>
  <script src="../script/services/analyticsService.js"></script>
  <script src="../script/services/stateManager.js"></script>
  <script src="../script/components/notification.js"></script>
  <script src="../script/components/userMenu.js"></script>
  <script src="../script/shared.js"></script>
  <script src="../script/utils/routeProtection.js"></script>

  <canvas id="particleCanvas" class="fixed inset-0 w-full h-full z-[-1] pointer-events-none"></canvas>

  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-[320px] min-w-[320px] glass border-r border-white/10 p-6 overflow-hidden !rounded-none flex flex-col">
      <div class="flex items-center gap-1 mb-10">
        <h1 class="text-3xl font-black tracking-tight leading-none">CPInsight</h1>
      </div>

      <div class="space-y-3 flex-1">
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='platforms.html'">🔌 Platforms</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='analytics.html'">🧠 Analytics</button>
        <button class="w-full min-w-0 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-2xl p-4 text-left font-semibold truncate shadow-[0_0_10px_rgba(16,185,129,0.1)]">👤 Profile</button>
        <button class="w-full min-w-0 hover:bg-white/5 border border-transparent rounded-2xl p-4 text-left transition truncate text-white" onclick="window.location.href='calendar.html'">📅 Calendar</button>
      </div>

      <button class="w-full bg-red-600/20 text-red-400 border border-red-500/30 rounded-2xl p-4 font-semibold hover:bg-red-600/30 transition" onclick="logout()">
        🚪 Logout
      </button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-auto">
      <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-12">
          <div>
            <h1 class="text-5xl font-black mb-3 bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-indigo-400">Your Profile</h1>
            <p class="text-gray-400 text-lg">Manage your account settings and connected platforms</p>
          </div>
          <div id="userMenuContainer"></div>
        </div>

        <!-- Profile Card -->
        <div class="glass rounded-3xl p-8 border border-white/10 mb-8">
          <h2 class="text-2xl font-bold mb-6">Account Information</h2>
          
          <div id="profileLoader" class="space-y-4">
            <div class="skeleton h-10 rounded-lg"></div>
            <div class="skeleton h-10 rounded-lg"></div>
            <div class="skeleton h-10 rounded-lg"></div>
          </div>

          <div id="profileContent" class="hidden space-y-6">
            <!-- Username -->
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-2">Username</label>
              <input type="text" id="username" disabled class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none text-white" />
            </div>

            <!-- Email -->
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-2">Email</label>
              <input type="email" id="email" disabled class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none text-white" />
            </div>

            <!-- Display Name -->
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-2">Display Name</label>
              <input type="text" id="displayName" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 transition text-white" placeholder="Your display name" />
            </div>

            <!-- Country -->
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-2">Country</label>
              <input type="text" id="country" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 transition text-white" placeholder="Your country" />
            </div>

            <!-- Timezone -->
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-2">Timezone</label>
              <select id="timezone" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 transition text-white">
                <option value="UTC">UTC</option>
                <option value="America/New_York">America/New_York</option>
                <option value="America/Los_Angeles">America/Los_Angeles</option>
                <option value="Europe/London">Europe/London</option>
                <option value="Europe/Paris">Europe/Paris</option>
                <option value="Asia/Tokyo">Asia/Tokyo</option>
                <option value="Asia/Shanghai">Asia/Shanghai</option>
                <option value="Asia/Dubai">Asia/Dubai</option>
                <option value="Australia/Sydney">Australia/Sydney</option>
              </select>
            </div>

            <!-- Joined Date -->
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-2">Joined</label>
              <input type="text" id="createdAt" disabled class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none text-gray-500" />
            </div>

            <!-- Save Button -->
            <button id="saveBtn" onclick="saveProfile()" class="w-full bg-emerald-600 py-3 rounded-xl font-semibold hover:bg-emerald-500 transition shadow-[0_0_15px_rgba(16,185,129,0.4)]">
              Save Changes
            </button>
          </div>
        </div>

        <!-- Connected Platforms -->
        <div class="glass rounded-3xl p-8 border border-white/10">
          <h2 class="text-2xl font-bold mb-6">Connected Platforms</h2>
          <div id="platformsContent">
            <p class="text-gray-400">Loading your connected platforms...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Notification Container -->
  <div id="notificationContainer"></div>

  <script>
    function displayProfile(profile) {
      if (!profile) {
        document.getElementById('profileLoader').innerHTML = '<p class="text-red-400">Failed to load profile. Please refresh.</p>';
        return;
      }

      // Populate fields
      document.getElementById('username').value = profile.username || '';
      document.getElementById('email').value = profile.email || '';
      document.getElementById('displayName').value = profile.user_profile?.display_name || '';
      document.getElementById('country').value = profile.user_profile?.country || '';
      document.getElementById('timezone').value = profile.user_profile?.timezone || 'UTC';
      document.getElementById('createdAt').value = new Date(profile.created_at).toLocaleDateString();

      // Show content
      document.getElementById('profileLoader').classList.add('hidden');
      document.getElementById('profileContent').classList.remove('hidden');
    }

    async function saveProfile() {
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const updates = {
          display_name: document.getElementById('displayName').value,
          country: document.getElementById('country').value,
          timezone: document.getElementById('timezone').value
        };

        await userService.updateProfile(updates);
        // Clear cache and reload
        userService.clearProfileCache();
        await stateManager.loadProfile();
        stateManager.showNotification('Profile updated successfully!', 'success');
      } catch (err) {
        stateManager.showNotification('Failed to update profile: ' + err.message, 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    }

    function displayPlatforms() {
      const { accounts } = stateManager.getState().platforms;

      if (accounts.length === 0) {
        document.getElementById('platformsContent').innerHTML = `
          <p class="text-gray-400 mb-4">No connected platforms yet.</p>
          <a href="platforms.html" class="inline-block bg-emerald-600 px-6 py-3 rounded-xl font-semibold hover:bg-emerald-500 transition">
            Connect a Platform
          </a>
        `;
        return;
      }

      document.getElementById('platformsContent').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${accounts.map(acc => `
            <div class="glass rounded-2xl p-4 border border-white/10">
              <div class="flex items-center justify-between mb-2">
                <p class="font-semibold text-white">${acc.platform.charAt(0).toUpperCase() + acc.platform.slice(1)}</p>
                <span class="text-emerald-400">✓</span>
              </div>
              <p class="text-gray-400 text-sm">Handle: <span class="text-emerald-400 font-mono">${acc.handle}</span></p>
              <p class="text-gray-500 text-xs">Rating: ${acc.rating || 'N/A'}</p>
              <p class="text-gray-600 text-xs mt-2">Last synced: ${acc.last_synced_at ? new Date(acc.last_synced_at).toLocaleDateString() : 'Never'}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function logout() {
      if (!confirm('Are you sure you want to logout?')) return;
      try {
        await authService.logout();
        window.location.href = 'auth.html';
      } catch (err) {
        console.error('Logout failed:', err);
      }
    }

    // Initialize page
    async function initializePage() {
      console.log('[Profile] Starting initialization...');
      // Check auth first
      if (!authService.isLoggedIn()) {
        window.location.href = 'auth.html';
        return;
      }

      console.log('[Profile] Page initialized, auth check passed');
      
      // Backend-first profile fetch
      try {
        console.log('[Profile] Fetching profile from backend...');
        const profile = await userService.getProfile({ skipCache: false });
        console.log('[Profile] Profile loaded successfully');
        displayProfile(profile);
        displayPlatforms();
        return;
      } catch (err) {
        console.error('[Profile] Profile loading failed:', err.message);
        document.getElementById('profileLoader').innerHTML = `
          <div class="bg-red-600/10 border border-red-500/30 rounded-lg p-4">
            <p class="text-red-400 font-semibold mb-2">Failed to load profile</p>
            <p class="text-red-300 text-sm mb-4">${err.message}</p>
            <button onclick="location.reload()" class="px-4 py-2 bg-red-600 rounded-lg text-white font-semibold hover:bg-red-500 transition">
              Retry
            </button>
          </div>
        `;
        return;
      }
    }

    // Subscribe to platform changes
    stateManager.subscribe((state) => {
      if (state.platforms.accounts) {
        displayPlatforms();
      }
    });

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      RouteProtection.protectPage();
      initParticles();
      initializePage();
    });
  </script>
</body>
</html>
