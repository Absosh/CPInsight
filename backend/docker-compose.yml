services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cpinsight:cpinsight@postgres:5432/cpinsight
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cpinsight
      POSTGRES_USER: cpinsight
      POSTGRES_PASSWORD: cpinsight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
